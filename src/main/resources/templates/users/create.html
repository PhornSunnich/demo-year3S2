<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>បន្ថែម User ថ្មី</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 550px;">
    <div class="card shadow-sm p-4">
        <h4 class="mb-3 text-center">
            បន្ថែម User ថ្មី
        </h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        </div>
        <form th:action="@{/users/save}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label">
                    ឈ្មោះពេញ
                </label>
                <input type="text" th:field="*{fullName}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">
                    អ៊ីមែល
                </label>
                <input type="email" th:field="*{email}" class="form-control" required />
            </div>
    <div class="mb-3">
        <label class="form-label">
            ពាក្យសម្ងាត់
        </label>
        <input type="password" th:field="*{password}" class="form-control" required />
    </div>
            <div class="mb-3">
                <label class="form-label">
                    តួនាទី (Role)
                </label>
                <select th:field="*{role}" class="form-select">
                    <option value="ROLE_USER">
                        USER
                    </option>
                    <option value="ROLE_ADMIN">
                        ADMIN
                    </option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a th:href="@{/users}" class="btn btn-secondary">
                    ថយក្រោយ
                </a>
                <button type="submit" class="btn btn-success">
                    រក្សាទុក
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
