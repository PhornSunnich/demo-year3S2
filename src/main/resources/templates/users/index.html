<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary">គ្រប់គ្រងអ្នកប្រើប្រាស់ (User List)</h4>
            <div> <a th:href="@{/users/create}" class="btn btn-primary">
                <i class="bi bi-person-plus">
                </i> បន្ថែម User ថ្មី </a>
                <a th:href="@{/home}" class="btn btn-outline-secondary">ទំព័រដើម</a>
            </div>
        </div>
        <div class="card-body">
            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${success}">
            </div> <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${error}">
        </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle text-center">
                    <thead class="table-dark">
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>ឈ្មោះពេញ</th>
                        <th>អ៊ីមែល</th>
                        <th>តួនាទី (Role)</th>
                        <th style="width: 180px;">សកម្មភាព</th>
                    </tr>
                    </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td class="text-start" th:text="${user.fullName}"></td>
                <td class="text-start" th:text="${user.email}"></td>
                <td>
                    <span class="badge bg-info text-dark"
                          th:text="${user.role}">
                    </span>
                </td>
                <td>
                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-warning me-1">
                        <i class="bi bi-pencil-square"></i> កែប្រែ </a>
                    <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger" onclick="return confirm('តើអ្នកពិតជាចង់លុប User នេះមែនទេ?');">
                        <i class="bi bi-trash"></i> លុប </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="text-muted py-4">
                    គ្មានទិន្នន័យ User នៅក្នុងប្រព័ន្ធឡើយ។
                </td>
            </tr>
            </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
