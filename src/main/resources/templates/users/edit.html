<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>កែប្រែព័ត៌មាន User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 550px;">
    <div class="card shadow-sm p-4">
        <h4 class="mb-3 text-center">
            កែប្រែ User (ID: <span th:text="${user.id}"></span>)
        </h4>
        <form th:action="@{/users/update/{id}(id=${user.id})}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label">ឈ្មោះពេញ</label>
                <input type="text" th:field="*{fullName}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">អ៊ីមែល</label>
                <input type="email" th:field="*{email}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">ពាក្យសម្ងាត់ថ្មី (ទុកទទេបើមិនចង់ប្តូរ)</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="បញ្ចូលលេខសម្ងាត់ថ្មី..." />
            </div>
            <div class="mb-3">
                <label class="form-label">តួនាទី (Role)</label>
                <select th:field="*{role}" class="form-select">
                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <a th:href="@{/users}" class="btn btn-secondary">ថយក្រោយ</a>
                <button type="submit" class="btn btn-primary">ធ្វើបច្ចុប្បន្នភាព</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
